name: smartdocs-staging
services:
  postgres:
    image: postgres:16
    container_name: SmartDocs-Postgres-Staging
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartdocs

    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: SmartDocs-redis-Staging
    restart: always

    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: SmartDocs-Rabbitmq-Staging
    restart: always

    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: SmartDocs-minio-Staging
    restart: always

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniostorage}

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: smartdocs-minio-init-staging
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${MINIO_BUCKET:-smartdocs} || true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniostorage}
      MINIO_BUCKET: ${MINIO_BUCKET:-smartdocs}
    restart: "no"

  api-service:
    image: smartdocs-api:staging

    build:
      context: ../../
      dockerfile: services/api-service/Dockerfile

    restart: always

    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio

    environment:
      ASPNETCORE_ENVIRONMENT: Staging

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartdocs;Username=postgres;Password=postgres

      Redis__ConnectionString: redis:6379

      RabbitMQ__Host: rabbitmq

      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minio}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-miniostorage}
      Minio__BucketName: ${MINIO_BUCKET:-smartdocs}

    ports:
      - "15000:8080"

  processing-service:
    image: smartdocs-processing:staging

    build:
      context: ../../
      dockerfile: services/processing-service/Dockerfile

    restart: always

    depends_on:
      - redis
      - rabbitmq

    environment:
      ASPNETCORE_ENVIRONMENT: Staging

      Redis__ConnectionString: redis:6379

      RabbitMQ__Host: rabbitmq

    ports:
      - "17001:7001"

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  redis_data:
