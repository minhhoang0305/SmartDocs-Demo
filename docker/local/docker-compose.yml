name: smartdocs-local
services:
  postgres:
    image: postgres:16
    container_name: SmartDocs-Postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      - POSTGRES_DB=smartdocs
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:3-management
    container_name: SmartDocs-Rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: minio_s3
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
    command: 
    - server 
    - /data 
    - --console-address 
    - :9001
    volumes:
      - minio_data:/data
  redis:
    image: redis:7
    container_name: redis-smartdocs
    ports: 
    - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  loki:
    image: grafana/loki:latest
    container_name: smartdocs-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: smartdocs-grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

  grafana-init:
    image: curlimages/curl:latest
    container_name: smartdocs-grafana-init
    depends_on:
      - grafana
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        until curl -fsS http://grafana:3000/api/health >/dev/null; do sleep 2; done
        curl -fsS \
          -u admin:$${GRAFANA_ADMIN_PASSWORD:-admin} \
          -H 'Content-Type: application/json' \
          -X POST http://grafana:3000/api/datasources \
          -d '{"name":"Loki","type":"loki","access":"proxy","url":"http://loki:3100","isDefault":true}' \
          || true
    environment:
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    restart: "no"

  minio-init:
    image: minio/mc:latest
    container_name: smartdocs-minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${MINIO_BUCKET:-smartdocs} || true
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-smartdocs}
    restart: "no"

  api-service:
    build:
      context: ../../
      dockerfile: services/api-service/Dockerfile
    container_name: smartdocs-api
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - minio
      - loki
      - vault
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartdocs;Username=postgres;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      Jwt__PrivateKeyBase64: ${JWT_PRIVATE_KEY_BASE64:?JWT_PRIVATE_KEY_BASE64}
      Jwt__PublicKeyBase64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64}
      Vault__Address: http://vault:8200
      Vault__Token: ${VAULT_TOKEN:?VAULT_TOKEN}
      Redis__ConnectionString: redis:6379
      RabbitMQ__Host: rabbitmq
      Loki__Uri: http://loki:3100
      Minio__Endpoint: minio:9000
      # Public endpoint used to generate presigned URLs that your host machine can reach
      Minio__PublicEndpoint: http://localhost:19000
      Minio__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
      Minio__BucketName: ${MINIO_BUCKET:-smartdocs}

  processing-service:
    build:
      context: ../../
      dockerfile: services/processing-service/Dockerfile
    container_name: smartdocs-processing
    ports:
      - "7001:7001"
    depends_on:
      - rabbitmq
      - redis
      - minio
      - loki
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Redis__ConnectionString: redis:6379
      RabbitMQ__Host: rabbitmq
      Loki__Uri: http://loki:3100
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: vault server -dev

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  redis_data:
  loki_data:
  grafana_data:
  vault_data:
