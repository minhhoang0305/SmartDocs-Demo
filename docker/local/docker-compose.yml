name: smartdocs-local
services:
  postgres:
    image: postgres:16
    container_name: SmartDocs-Postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smartdocs
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:3-management
    container_name: SmartDocs-Rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: minio_s3
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-miniostorage}
    command: 
    - server 
    - /data 
    - --console-address 
    - :9001
    volumes:
      - minio_data:/data
  redis:
    image: redis:7
    container_name: redis-smartdocs
    ports: 
    - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  seq:
    image: datalust/seq:latest
    container_name: smartdocs-seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: smartdocs-minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${MINIO_BUCKET:-smartdocs} || true
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-miniostorage}
      - MINIO_BUCKET=${MINIO_BUCKET:-smartdocs}
    restart: "no"

  api-service:
    build:
      context: ../../
      dockerfile: services/api-service/Dockerfile
    container_name: smartdocs-api
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - minio
      - seq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartdocs;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
      RabbitMQ__Host: rabbitmq
      Seq__ServerUrl: http://seq
      Minio__Endpoint: minio:9000
      # Public endpoint used to generate presigned URLs that your host machine can reach
      Minio__PublicEndpoint: http://localhost:19000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minio}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-miniostorage}
      Minio__BucketName: ${MINIO_BUCKET:-smartdocs}

  processing-service:
    build:
      context: ../../
      dockerfile: services/processing-service/Dockerfile
    container_name: smartdocs-processing
    ports:
      - "7001:7001"
    depends_on:
      - rabbitmq
      - redis
      - minio
      - seq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Redis__ConnectionString: redis:6379
      RabbitMQ__Host: rabbitmq
      Seq__ServerUrl: http://seq
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minio}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-miniostorage}

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  redis_data:
  seq_data:
