version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: SmartDocs-Progres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smartdocs
    ports:
      - "5432:5432"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: SmartDocs-Rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    container_name: minio_s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ACCESS_KEY= ${MINIO_ACCESS_KEY:-minio}
      - MINIO_SECRET_KEY= ${MINIO_SECRET_KEY:-miniostorage}
      - MINIO_REGION_NAME= ${MINIO_REGION_NAME:-us-east-1}
    command: 
    - server 
    - /data 
    - --console-address 
    - :9001
  redis:
    image: redis:7
    container_name: redis-smartdocs
    ports: 
    - "6379:6379"